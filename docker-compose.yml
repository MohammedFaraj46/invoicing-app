# The whole stack: database, backend, and nginx serving the built frontend.
#
#   JWT_SECRET=$(openssl rand -base64 48) docker compose up --build
#
# or put JWT_SECRET in a .env file next to this one — compose reads it, and .env
# is gitignored. There is no default on purpose: a signing key with a fallback
# is a signing key everybody knows.
#
# Then open http://localhost — one port, one origin, everything behind it.
#
# This does not replace `npm run dev`. The Vite dev server with its own proxy is
# still the way to work on the frontend; this is what the result looks like once
# it is built.

services:
  db:
    image: postgres:16
    container_name: invoice-db
    environment:
      POSTGRES_DB: invoice
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # "Running" and "ready to accept connections" are not the same moment:
    # Postgres starts, initialises its data directory, restarts itself and only
    # then listens. Without this the backend would race it and Flyway would fail
    # on the first connection.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice -d invoice"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    build:
      # the repository root, so the Dockerfile can reach backend/ and the
      # .dockerignore at the root governs what is sent
      context: .
      dockerfile: backend/Dockerfile
    container_name: invoice-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # "db" is the service name on the compose network — localhost inside this
      # container is the container itself, not the database
      DB_URL: jdbc:postgresql://db:5432/invoice
      DB_USERNAME: invoice
      DB_PASSWORD: localdev
      # required, and never baked into the image
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your environment or in a .env file}
      # false for plain HTTP locally; true once this sits behind HTTPS
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
    # Kept published even though nginx now reaches the backend over the compose
    # network, because `npm run dev` proxies to localhost:8080 — closing this
    # would mean the containerised backend could no longer serve the dev server.
    # In production this line goes, and the API is reachable through nginx only.
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: invoice-frontend
    # Not just "depends_on: backend". nginx resolves and proxies per request, so
    # it would come up fine on its own — but a frontend that answers with 502
    # for the first forty seconds looks broken to whoever opens it. Waiting for
    # a healthy backend means the first click already works.
    depends_on:
      backend:
        condition: service_healthy
    # The single entrance: :80 on the host, 8080 inside because nginx runs
    # unprivileged. Nothing else needs publishing for the app to be usable.
    ports:
      - "80:8080"

volumes:
  pgdata:
