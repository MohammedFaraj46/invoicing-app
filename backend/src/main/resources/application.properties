spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/invoice
spring.datasource.username=invoice
spring.datasource.password=localdev

# Normaal gesproken zou ik update kiezen zodat Hibernate de tabellen zelf gaat verzinnen, 
# maar Flyway zal de tabellen aanmaken
spring.jpa.hibernate.ddl-auto=validate
# Off: it writes every statement to stdout, which drowns the lines that say
# something happened. Turn it on for one run when you are debugging a query.
spring.jpa.show-sql=false

spring.flyway.enabled=true

# JWT. The secret comes from the JWT_SECRET environment variable and has no
# fallback on purpose: an empty value fails validation at startup rather than
# silently signing tokens with a predictable key. Minimum 32 characters (HS256).
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=4h
app.jwt.cookie-name=jwt
# Local development is plain HTTP; switch this on once the app is behind HTTPS.
app.jwt.cookie-secure=false

# Logging. INFO for our own packages so the meaningful events (registration,
# login, sending, paying, crediting, deleting) show up without the framework
# chatter around them.
logging.level.io.github.mohammedfaraj46.backend=INFO

# Error responses never carry internals: no stack trace, no exception message,
# no binding details. These are the Boot defaults, written down so a later
# change to them is a deliberate one.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
