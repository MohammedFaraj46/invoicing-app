<!doctype html>
<!--
  class="dark" activates Chakra's _dark condition. The theme forces dark
  surfaces regardless, but without this flag every colour Chakra derives from a
  palette (the text of ghost and outline buttons, for one) resolves to its
  light-mode value and disappears against the background.
-->
<html lang="nl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Facturatie</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
