spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/invoice
spring.datasource.username=invoice
spring.datasource.password=localdev

# Normaal gesproken zou ik update kiezen zodat Hibernate de tabellen zelf gaat verzinnen, 
# maar Flyway zal de tabellen aanmaken
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true

# JWT. The secret comes from the JWT_SECRET environment variable and has no
# fallback on purpose: an empty value fails validation at startup rather than
# silently signing tokens with a predictable key. Minimum 32 characters (HS256).
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=4h
app.jwt.cookie-name=jwt
# Local development is plain HTTP; switch this on once the app is behind HTTPS.
app.jwt.cookie-secure=false