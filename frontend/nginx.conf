# Nginx as the single front door: it serves the built SPA and forwards /api to
# the backend container, so the browser only ever talks to one origin. That is
# the same arrangement the Vite dev proxy creates locally, which is why the
# httpOnly login cookie and the readable XSRF-TOKEN cookie keep working here
# without a line of CORS configuration.

server {
    # 8080, not 80: the runtime image runs as an unprivileged user and a
    # non-root process may not bind a port below 1024. Compose publishes this
    # as :80 on the host.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Version numbers on error pages and in the Server header tell an attacker
    # which CVEs to try first. They tell us nothing.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS. Needed because the upstream below is written as a
    # variable - see the comment there.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # ---------------------------------------------------------------------
    # API
    # ---------------------------------------------------------------------
    # This block comes first in the file for readability only; nginx picks the
    # longest matching prefix regardless of order, so /api/... lands here and
    # never in the SPA fallback below. An unknown /api path therefore returns
    # the backend's own 401 or 404 problem+json, not an HTML page - which is
    # what the frontend's error handling expects to parse.
    location /api/ {
        # "backend" is the compose service name. localhost inside this
        # container is nginx itself.
        #
        # Via a variable on purpose: with a literal hostname nginx resolves the
        # upstream once at startup and caches that IP forever, so restarting the
        # backend container (which gets a new IP) would leave nginx proxying
        # into the void until it is restarted too. A variable forces a lookup
        # per request, honouring the resolver's 10s cache above. The price is
        # that $request_uri must be appended by hand - nginx does not pass the
        # path through for a variable upstream.
        set $backend http://backend:8080;
        proxy_pass $backend$request_uri;

        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The scheme the browser used, which is http here and https once this
        # sits behind TLS. The backend does not derive the cookie's Secure flag
        # from it - that is JWT_COOKIE_SECURE, a deliberate per-environment
        # setting - but anything that ever needs to build an absolute URL will
        # want the real scheme rather than nginx's.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Nothing here rewrites cookies. That is the point: Set-Cookie comes
        # back from the backend with its own Path and SameSite and is handed to
        # the browser untouched, and the Cookie header goes up the same way.
        # proxy_cookie_path / proxy_cookie_domain would only be needed if the
        # API lived on a different path or host than the app, and it does not.

        # A PDF render is slower than a JSON call but nowhere near a minute.
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # An invoice with many lines is still a few kilobytes; the default 1m
        # is plenty. Written down so raising it later is a decision.
        client_max_body_size 1m;
    }

    # ---------------------------------------------------------------------
    # Static assets
    # ---------------------------------------------------------------------
    # Vite fingerprints everything in here (index-D4f9k2.js). A fingerprinted
    # file never changes content, so it can be cached until the heat death of
    # the browser; a new build simply asks for a different name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # no SPA fallback here: a missing asset is a bug and should say 404
        # rather than quietly hand back HTML that the browser then tries to
        # execute as JavaScript.
        try_files $uri =404;
    }

    # The one file that must never be cached, because it is what points at the
    # fingerprinted assets. Cache it and a deploy stays invisible.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ---------------------------------------------------------------------
    # SPA
    # ---------------------------------------------------------------------
    # The router lives in the browser, so the server has no /invoices/5 to
    # serve. Handing back index.html lets React read the URL and render the
    # right screen - without this, refreshing any page but the root is a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
