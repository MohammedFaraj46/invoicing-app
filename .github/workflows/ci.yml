name: CI

# Every push to any branch, so a feature branch reports its state while it is
# still being worked on rather than only once it is proposed for merging.
#
# The pull request trigger stays: it is the one that answers the question main
# actually cares about — whether merging would break it — and it is what a branch
# protection rule can be hung on. A branch push and a pull request from that same
# branch will both run; see the note on the concurrency group below.
#
# '**' rather than no filter at all: that would also fire on tag pushes, which
# build nothing new here.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Read-only. The workflow builds and tests; it has no reason to be able to write
# to the repository, and a token that cannot write cannot be misused.
permissions:
  contents: read

# A second push to the same branch makes the first run pointless, so cancel it
# instead of paying for both.
#
# Push and pull_request runs are kept in separate groups on purpose. They could
# be merged — keying on the branch name would make a push cancel the pull
# request's run — but then the check a merge depends on could be cancelled by an
# unrelated push, which is a worse failure than paying for one extra run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    # The suite takes about five minutes; this only stops a hung run from
    # burning an hour of runner time.
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # caches ~/.m2/repository, keyed on the pom. A run that changes no
          # dependencies skips the downloads entirely.
          cache: maven

      # No services: block and no JWT_SECRET here on purpose.
      #
      # Testcontainers starts PostgreSQL 16 itself — see
      # AbstractPostgresIntegrationTest, which owns the container and points
      # Spring at it with @ServiceConnection. A database service in this file
      # would be a second, unused database.
      #
      # The same base class supplies app.jwt.secret through
      # @DynamicPropertySource, so the tests need no secret from the
      # environment. Every test that boots a Spring context extends it; the rest
      # are plain unit tests that start nothing.
      #
      # Docker is preinstalled on ubuntu-latest, which is what Testcontainers
      # needs and the only reason the runner choice matters.
      - name: Run the test suite
        working-directory: backend
        run: ./mvnw -B -ntp test

      # Surefire writes a report per test class. On a green run they say nothing
      # new; on a red one they are the difference between "something failed" and
      # knowing which assertion, with what values.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  image:
    name: Backend image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Deliberately not "needs: test". The two answer different questions — does
    # the code work, and does it still package — and running them side by side
    # means one push reports both failures at once instead of one after the
    # other.
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # Building is the whole check: it proves the multi-stage build still
      # works, that the jar is produced and that the runtime stage assembles.
      # Nothing is pushed anywhere - there is no registry and no credentials in
      # this workflow.
      - name: Build the backend image
        run: docker build -f backend/Dockerfile -t invoicing-backend:ci .
