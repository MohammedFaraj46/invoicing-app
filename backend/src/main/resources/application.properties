spring.application.name=backend

# Database. The defaults are the local docker compose database, so the app runs
# from an IDE with no environment set; in a container DB_URL points at the db
# service by name. Nothing here is a production secret - those arrive as
# environment variables and never get baked into an image.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/invoice}
spring.datasource.username=${DB_USERNAME:invoice}
spring.datasource.password=${DB_PASSWORD:localdev}

# Normaal gesproken zou ik update kiezen zodat Hibernate de tabellen zelf gaat verzinnen, 
# maar Flyway zal de tabellen aanmaken
spring.jpa.hibernate.ddl-auto=validate
# Off: it writes every statement to stdout, which drowns the lines that say
# something happened. Turn it on for one run when you are debugging a query.
spring.jpa.show-sql=false

spring.flyway.enabled=true

# JWT. The secret comes from the JWT_SECRET environment variable and has no
# fallback on purpose: an empty value fails validation at startup rather than
# silently signing tokens with a predictable key. Minimum 32 characters (HS256).
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=4h
app.jwt.cookie-name=jwt
# Local development is plain HTTP, so the default is off. Behind HTTPS set
# JWT_COOKIE_SECURE=true and the login cookie stops travelling over plain
# connections; that is a per-environment decision, not a code change.
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}

# Logging. INFO for our own packages so the meaningful events (registration,
# login, sending, paying, crediting, deleting) show up without the framework
# chatter around them.
logging.level.io.github.mohammedfaraj46.backend=INFO

# PDFBox warns once per render that it is substituting the PDF standard-14 fonts
# (Helvetica, Times, Courier) because the container has no system fonts. Our
# documents never use them: the templates ask for DejaVu Sans, which is embedded
# from the jar and asserted to be embedded by InvoicePdfIntegrationTest. Thirteen
# warnings per invoice download about fonts we do not reference is noise, so the
# mapper is quiet below ERROR. A real font failure still gets through.
logging.level.org.apache.pdfbox.pdmodel.font=ERROR

# Error responses never carry internals: no stack trace, no exception message,
# no binding details. These are the Boot defaults, written down so a later
# change to them is a deliberate one.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Actuator: health only, and without the per-component breakdown. Enough for a
# container health check to tell whether the app and its database are up,
# without publishing which components exist or why one is down.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
